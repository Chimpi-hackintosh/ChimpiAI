name: Check localized support notice
on:
  pull_request:
    paths: ['support_notice.py', 'tests/**', 'packaging/**', 'ChimpiAI-installer.py', '.github/workflows/support-notice.yml']
permissions:
  contents: read
jobs:
  support-notice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python packaging/prepare_app.py
      - run: python -m compileall -q ChimpiAI-installer.py support_notice.py packaging build
